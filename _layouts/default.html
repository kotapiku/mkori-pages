<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/paris-sitting.jpg' | absolute_url }}">
    <meta property="og:image:alt" content="Mayuko Kori sitting in a park in Paris">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#faf9f6">
    <link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header page-width">
      <nav aria-label="Main navigation">
        <a href="#publications">Publications</a>
        <a href="#education">CV</a>
        <a href="#teaching-experiences">Teaching</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <main id="main-content" class="page-width" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer page-width">
      <span>Mayuko Kori <span lang="ja">/ 郡 茉友子</span></span>
      <a href="#main-content">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </body>
</html>
